name: 功能建议 / Feature request
description: 提出有明确使用场景的功能或改进。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        B站、小红书等没有 RSS 的平台经自建 RSSHub 接入，见 [RSSHub 文档](https://github.com/Waytobetter619/techinhot/blob/main/docs/rsshub.md)。
        只有某个场景要的功能，做成模块放进 `modules/`，见 [架构文档](https://github.com/Waytobetter619/techinhot/blob/main/docs/architecture.md#模块)。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 谁在什么情况下需要它？目前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
      description: 描述你希望看到的行为或结果，也可以附具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法（可选）
      description: 现有配置、脚本或其他方案为什么不能满足需求？
